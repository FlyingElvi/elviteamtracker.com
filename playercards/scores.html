<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The stream overlay's score ticker (Nov 17, elvis): an OBS browser
       source along the bottom of the band, 1664 wide by default. The
       Furballs' primary and affiliate games posted in their discord, newest
       first, scrolling left in a loop (/stream/scores).
       ?speed=<px/s> (default 70), ?bg=transparent | true | <hex>,
       ?fs=<px> text size (default 19; the bar height is the OBS source's),
       ?c=<code> a ticker built on the web (ticker.html): its discord, teams and leagues. -->
  <meta name="robots" content="noindex">
  <title>Stream scores — Elvi's Team Tracker</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: #060a14; color: #e8eef8;
           font-family: 'Bahnschrift SemiBold Condensed', 'Bahnschrift Condensed', Bahnschrift, 'Arial Narrow', sans-serif;
           font-size: calc(19px * var(--k, 1)); line-height: 1; }
    body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
                   background: rgba(79, 195, 247, .55); }
    body.clear { background: transparent; }
    body.clear::before { display: none; }
    .bar { position: absolute; inset: 0; display: flex; align-items: center; }
    .tag { flex: none; height: 100%; display: flex; align-items: center; padding: 0 14px;
           background: #4fc3f7; color: #06101e; font-weight: bold; letter-spacing: .12em; font-size: calc(15px * var(--k, 1));
           position: relative; z-index: 1; }
    .view { flex: 1; height: 100%; overflow: hidden; position: relative;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
    .reel { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center;
            white-space: nowrap; will-change: transform; }
    .g { display: inline-flex; align-items: center; gap: 8px; padding: 0 22px; position: relative; }
    .g::after { content: ''; position: absolute; right: 0; top: 50%; width: 4px; height: 4px; margin-top: -2px;
                border-radius: 50%; background: #3a4a66; }
    /* a club's name opens its games; the separator dot stays between games */
    .club { color: #fff; text-transform: uppercase; letter-spacing: .04em; padding: 0 4px 0 34px; }
    .club.primary { color: #4fc3f7; }
    .club + .g { padding-left: 12px; }
    .r { font-size: calc(13px * var(--k, 1)); font-weight: bold; padding: 3px 5px 2px; border-radius: 3px; color: #06101e; }
    .r.W { background: #4ade80; } .r.L { background: #f87171; } .r.OTL { background: #fbbf24; }
    .us { color: #fff; }
    .s { color: #4fc3f7; font-variant-numeric: tabular-nums; }
    .opp { color: #9fb0c8; }
    /* Nov 25: a league's chip, and the ETT's remarks on a game */
    .lg { margin: 0 4px 0 30px; padding: 3px 8px 2px; border-radius: 3px; background: #1d2c4a; color: #4fc3f7;
          font-weight: bold; font-size: calc(14px * var(--k, 1)); letter-spacing: .1em; text-transform: uppercase; }
    .lg.night { background: #4fc3f7; color: #06101e; margin-right: 0; }
    .note .txt { color: #e8eef8; }
    /* Nov 25: the ETT's voice is Elvi (the bot's avatar), no longer an "ETT" box */
    .elvi { display: inline-flex; align-items: center; gap: 7px; color: #4fc3f7; font-weight: bold;
            font-size: calc(13px * var(--k, 1)); letter-spacing: .12em; }

    .t { color: #5d6f8c; font-size: calc(14px * var(--k, 1)); }
    .empty { padding: 0 22px; color: #9fb0c8; }
    /* Nov 25: SCORE ALERT -- a game that just finished takes over the bar for a few seconds */
    .alert { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
             padding: 0 18px; white-space: nowrap; overflow: hidden;
             background: linear-gradient(90deg, #7a0f1d, #1a0a12 55%, #060a14);
             box-shadow: inset 0 -2px 0 #ff4d5e; transform: translateY(100%); opacity: 0;
             transition: transform .45s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
    .alert.on { transform: none; opacity: 1; }
    .alert .al-tag { flex: none; padding: 3px 10px 2px; border-radius: 3px; background: #ff4d5e; color: #fff;
                     font-weight: bold; letter-spacing: .14em; animation: al-blink 1s steps(2, jump-none) infinite; }
    .alert .al-fin { color: #ffb3bb; letter-spacing: .12em; font-weight: bold; }
    .alert .al-sc { color: #fff; font-weight: bold; font-variant-numeric: tabular-nums; }
    .alert .al-club { color: #4fc3f7; text-transform: uppercase; letter-spacing: .04em; }
    .alert .al-opp { color: #cfd9ea; text-transform: uppercase; letter-spacing: .04em; }
    .alert .al-note { color: #e8eef8; overflow: hidden; text-overflow: ellipsis; }
    @keyframes al-blink { 50% { background: #b3202f; } }
    /* the "around the league" pass: the other teams' finals, in blue */
    .alert.pass { background: linear-gradient(90deg, #0b3a5c, #0a1424 60%, #060a14); box-shadow: inset 0 -2px 0 #4fc3f7; }
    .alert .al-tag.pass { background: #4fc3f7; color: #06101e; animation: none; }
    .alert .al-res { display: inline-flex; align-items: center; gap: 8px; flex: none; }
    .alert .al-res .lg { margin: 0; }
    .alert .al-w { color: #fff; text-transform: uppercase; letter-spacing: .04em; }
  </style>
